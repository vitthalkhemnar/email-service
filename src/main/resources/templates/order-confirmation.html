<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Order Confirmation</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F1E7; font-family: Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F1E7; padding: 32px 0;">
    <tr>
      <td align="center">
        <table width="580" cellpadding="0" cellspacing="0" style="background:#FFFFFF; border-radius:4px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#17203A; padding:24px 32px; border-bottom:3px solid #E8871E;">
              <span style="color:#F5F1E7; font-size:22px; font-weight:bold;">Bazaar</span>
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td style="padding:32px 32px 8px;">
              <h1 style="margin:0; font-size:20px; color:#17203A;">
                Thanks for your order, <span th:text="${username}">customer</span>!
              </h1>
              <p style="margin:8px 0 0; font-size:13.5px; color:#5B5F7A;">
                Order <strong th:text="'#' + ${bookingId}">#0</strong> placed on
                <span th:text="${orderDate}">date</span>
              </p>
            </td>
          </tr>

          <!-- Status pill -->
          <tr>
            <td style="padding:8px 32px 24px;">
              <span style="display:inline-block; background:rgba(63,125,88,0.12); color:#3F7D58; font-size:12.5px; font-weight:bold; padding:4px 12px; border-radius:999px;"
                    th:text="${status}">
                CONFIRMED
              </span>
            </td>
          </tr>

          <!-- Items -->
          <tr>
            <td style="padding:0 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr th:each="item : ${items}">
                  <td style="padding:14px 0; border-bottom:1px solid #E4DFD2;">
                    <table width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td>
                          <div style="font-size:14.5px; font-weight:bold; color:#17203A;" th:text="${item.productName}">
                            Product name
                          </div>
                          <div style="font-size:12.5px; color:#5B5F7A; margin-top:2px;">
                            <span th:text="${item.variant}">Standard</span> ·
                            Qty <span th:text="${item.quantity}">1</span>
                          </div>
                        </td>
                        <td align="right" style="font-size:15px; font-weight:bold; color:#17203A; white-space:nowrap;">
                          &#8377;<span th:text="${item.lineTotal}">0.00</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Total -->
          <tr>
            <td style="padding:20px 32px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-size:16px; font-weight:bold; color:#17203A;">Total</td>
                  <td align="right" style="font-size:18px; font-weight:bold; color:#17203A;">
                    &#8377;<span th:text="${totalAmount}">0.00</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#F5F1E7; padding:20px 32px; text-align:center;">
              <span style="font-size:11.5px; color:#5B5F7A;">
                You're receiving this because you placed an order on Bazaar.
              </span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
