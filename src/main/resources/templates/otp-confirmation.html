<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Login Verification Code</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F1E7; font-family: Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F1E7; padding: 32px 0;">
    <tr>
      <td align="center">
        <table width="580" cellpadding="0" cellspacing="0" style="background:#FFFFFF; border-radius:4px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background-color:#17203A; padding:24px 32px; border-bottom:3px solid #E8871E;">
              <span style="color:#F5F1E7; font-size:22px; font-weight:bold;">Bazaar</span>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px 32px 24px;">
              <h1 style="margin:0 0 16px; font-size:20px; color:#17203A;">Your Login Verification Code</h1>
              <p style="margin:0 0 24px; font-size:14px; color:#5B5F7A; line-height:1.5;">
                Please use the One-Time Password (OTP) below to log in to your account. This code is valid for 5 minutes.
              </p>
              <div style="background-color:#F8F9FA; border:1px dashed #E8871E; border-radius:6px; padding:16px; text-align:center; margin-bottom:24px;">
                <span th:text="${otp}" style="font-size:32px; font-weight:bold; letter-spacing:6px; color:#17203A;">123456</span>
              </div>
              <p style="margin:0; font-size:13px; color:#8C8FA7; line-height:1.4;">
                If you did not request this code, please ignore this email. Do not share this OTP with anyone.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color:#F5F1E7; padding:16px 32px; text-align:center; font-size:12px; color:#8C8FA7;">
              &copy; Bazaar E-Commerce. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
